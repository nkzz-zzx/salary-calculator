<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="智能工具小站，提供简单实用的在线工具。">
<title>智能工具小站</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --line: #e5e9f2;
    --text: #172033;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-dark: #1e3a8a;
    --accent-soft: #eaf1fe;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(30, 58, 138, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 12% 8%, rgba(59,130,246,.12), transparent 28rem), var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 58%, #3b82f6 100%);
    color: #fff;
  }
  .header-inner, main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
  .header-inner { padding: 42px 0 40px; }
  .brand-kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,.85);
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #86efac; box-shadow: 0 0 0 5px rgba(134,239,172,.16); }
  h1 { margin: 0; font-size: clamp(30px, 5vw, 42px); line-height: 1.2; letter-spacing: .03em; }
  header p { margin: 10px 0 0; font-size: 16px; color: rgba(255,255,255,.82); }
  main { padding: 30px 0 64px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .section-head h2 { margin: 0; font-size: 20px; }
  .count { color: var(--muted); font-size: 14px; }
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .tool-card {
    min-height: 176px;
    display: flex;
    flex-direction: column;
    color: inherit;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .tool-card:hover, .tool-card:focus-visible {
    transform: translateY(-3px);
    border-color: #bfd2fb;
    box-shadow: 0 16px 36px rgba(30,58,138,.13);
    outline: none;
  }
  .tool-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .tool-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: linear-gradient(145deg, var(--accent-dark), var(--accent));
    color: #fff;
    font-size: 22px;
    font-weight: 800;
  }
  .tag { color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
  .tool-card h3 { margin: 17px 0 5px; font-size: 19px; }
  .tool-card p { margin: 0; color: var(--muted); font-size: 15px; }
  .tool-action { margin-top: auto; padding-top: 18px; display: flex; align-items: center; justify-content: space-between; color: var(--accent); font-size: 14px; font-weight: 700; }
  .tool-action span:last-child { font-size: 20px; transition: transform .18s ease; }
  .tool-card:hover .tool-action span:last-child { transform: translateX(3px); }
  .coming { margin: 20px 0 0; color: var(--muted); font-size: 14px; }
  footer { padding: 20px 16px 34px; text-align: center; color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) {
    .header-inner { padding: 32px 0 30px; }
    main { padding-top: 24px; }
    .tool-card { min-height: 164px; padding: 19px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand-kicker"><span class="brand-dot" aria-hidden="true"></span>简单、清晰、即开即用</div>
    <h1>智能工具小站</h1>
    <p>从收入测算开始，持续加入更多实用工具。</p>
  </div>
</header>

<main>
  <section aria-labelledby="tools-title">
    <div class="section-head">
      <h2 id="tools-title">全部工具</h2>
      <span class="count">3 个工具</span>
    </div>
    <div class="tool-grid">
      <a class="tool-card" href="./salary-calculator.html">
        <div class="tool-top">
          <div class="tool-icon" aria-hidden="true">¥</div>
          <span class="tag">收入与个税</span>
        </div>
        <h3>工资与个税计算器</h3>
        <p>测算全年收入、五险一金、专项扣除、个税和年终奖方案。</p>
        <div class="tool-action"><span>打开计算器</span><span aria-hidden="true">→</span></div>
      </a>
      <a class="tool-card" href="./agent-roadmap.html">
        <div class="tool-top">
          <div class="tool-icon" aria-hidden="true">AI</div>
          <span class="tag">学习与实践</span>
        </div>
        <h3>Agent 学习路线</h3>
        <p>用十周串起 Agent 原理、开源实现和工程实践，附学习资料与验收标准。</p>
        <div class="tool-action"><span>开始学习</span><span aria-hidden="true">→</span></div>
      </a>
      <a class="tool-card" href="./hot100.html">
        <div class="tool-top">
          <div class="tool-icon" aria-hidden="true">100</div>
          <span class="tag">算法与图解</span>
        </div>
        <h3>力扣 Hot 100 思路图解</h3>
        <p>100 道题逐题讲解，配合 17 张题型示意图，读懂直觉、步骤、易错点与复杂度。</p>
        <div class="tool-action"><span>查看题解思路</span><span aria-hidden="true">→</span></div>
      </a>
    </div>
    <p class="coming">更多实用工具将陆续加入。</p>
  </section>
</main>

<footer>智能工具小站 · <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备2026061235号-1</a></footer>
</body>
</html>
